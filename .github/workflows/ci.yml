name: ci

# Fast tier: three jobs whose names are the required checks set by
# `cargo xtask protect-main`. Focused development checks run locally; the
# required CI inventory also builds the standalone validator and Rust consumer.
# The whole test suite and wider conformance gates run locally with
# `cargo xtask gate --full` at integrated milestones, and in conformance.yml
# on manual dispatch.
#
# Push to main runs the same jobs. Branch protection is not strict, so a
# merged PR can still meet a main it was never tested against; the push run
# checks the merged result, and it is also the only run whose rust-cache
# entries every PR can restore (PR caches are scoped to their own ref).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  no-ai-authorship:
    # Required check name; must match `cargo xtask protect-main`.
    name: No AI authorship markers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits for AI authorship markers
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            scripts/check-ai-markers.sh range "$PR_BASE" "$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            # Scan every commit in the push, not just the tip.
            scripts/check-ai-markers.sh range "$PUSH_BEFORE" "$SHA"
          else
            # New branch, force push, or manual run: scan full history.
            scripts/check-ai-markers.sh all "$SHA"
          fi

  workspace-gate:
    # Required check name; must match `cargo xtask protect-main`.
    # Mirrored locally by `cargo xtask gate --fast`.
    name: Workspace gate
    runs-on: ubuntu-latest
    # Hosted-runner measurements reached 22m30s in nextest (including its
    # build), with all tests passing. Leave bounded time for the remaining
    # docs, standalone builds, external consumer and dependency checks.
    # Test selection, individual test deadlines and required checks stay fixed.
    timeout-minutes: 35
    env:
      # Line tables are not needed to run tests in CI, and the whole test
      # inventory must fit on the runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Free runner disk in the background
        # The test inventory does not fit in the ~9 GB a hosted runner leaves
        # free after checkout (the linker dies with SIGBUS). Deleting unused
        # preinstalled SDKs frees ~15 GB; it runs while the job compiles.
        run: nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base), for the
          # dependency-policy diff below.
          fetch-depth: 2
          persist-credentials: false
      - name: Repository budget (ADR 0086)
        run: python3 -I scripts/check-repo-budget.py
      - name: User documentation prose
        run: python3 -I scripts/check-docs-prose.py --quiet
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: workspace-gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Did Cargo.lock or deny.toml change?
        id: deny
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # A step-level condition, not a path filter: the required check
          # must always report. Outside PRs, always run cargo-deny.
          if [ "$EVENT" = "pull_request" ] && git diff --quiet HEAD^1 HEAD -- Cargo.lock deny.toml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: ${{ steps.deny.outputs.run == 'true' && 'cargo-nextest,cargo-deny' || 'cargo-nextest' }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: tests (nextest ci profile)
        run: cargo nextest run --workspace --locked --profile ci
      - name: doctests
        run: cargo test --workspace --doc --locked
      - name: rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: crate layering
        run: cargo xtask check-layering
      - name: standalone trace build
        run: cargo build -p dive-trace --locked --target-dir target/standalone-trace
      - name: external Rust consumer (no Java or CLI on PATH)
        run: scripts/test-rust-consumer.sh
      - name: cargo-deny
        if: ${{ steps.deny.outputs.run == 'true' }}
        run: cargo deny --locked check

  conformance-gate:
    # Required check name; must match `cargo xtask protect-main`.
    # Smoke subset of the CM1 gate: `dive check --compat=tlc` on the default
    # engine (Core) must agree with the committed TLC goldens, then Core in the
    # default profile on core-smoke.txt. Never runs TLC. The whole CM1 list and
    # the validation-smoke corpus run in `cargo xtask gate --full`.
    name: Conformance gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DIVE_CACHE_DIR: ${{ github.workspace }}/../dive-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-gate
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache oracles, JRE and corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIVE_CACHE_DIR }}
          key: dive-cache-${{ runner.os }}-${{ hashFiles('conformance/oracles.toml', 'conformance/corpora.toml') }}
      - name: Build harness and dive
        run: cargo build --release --locked -p dive-conformance -p dive-cli
      - name: Fetch and verify oracles and corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target/release/dive-conformance oracle fetch
          target/release/dive-conformance corpus fetch --corpus examples
      - name: Smoke gate (Core, tlc profile, 1 and 4 workers)
        env:
          DIVE_GATE_IMPL: dive:core
        run: scripts/conformance-gate.sh conformance/gates/smoke.txt --workers 1,4
      - name: Core golden gate (Core alone vs TLC goldens, 1 and 4 workers)
        env:
          DIVE_GATE_IMPL: dive:core
          DIVE_GATE_PROFILE: dive
        run: scripts/conformance-gate.sh conformance/gates/core-smoke.txt --workers 1,4
      - name: Bare-use smoke (default engine Core, bundled libraries, explicit named refusal)
        run: |
          python3 scripts/test-bare-use-smoke.py
          python3 scripts/bare-use-smoke.py

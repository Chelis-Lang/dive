name: conformance

# Standard and deep conformance tiers (ADR 0001), on manual dispatch with a
# chosen tier (default small). Nightly, the `baseline` job alone runs dive's
# small tier in both profiles and fails on any regression against the
# committed baselines in conformance/baselines/ (`run --baseline`). The
# dispatched `conformance` job runs the pinned TLC against the
# committed goldens, with worker-count invariance (charter rule 7) and the
# Examples manifest cross-check. Then runs dive under --compat=tlc (`dive
# analyze` on the modules of every module corpus, `dive check` on the tier's
# models), `dive check` under dive's default profile, and `dive parse`
# against SANY's parse phase, and uploads the reports. Never runs on push or PR; ci.yml is the
# fast tier.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Conformance tier"
        type: choice
        options: [small, deep]
        default: small
      scope:
        description: "Run all checks or only the deep frontend campaign"
        type: choice
        options: [all, frontend]
        default: all

permissions:
  # Enough to download this repository's own (private) release assets.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DIVE_CACHE_DIR: ${{ github.workspace }}/../dive-cache
  TIER: ${{ inputs.tier || 'small' }}

jobs:
  frontend-campaign:
    name: Frontend campaign (deep)
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.tier == 'deep' || inputs.scope == 'frontend') }}
    runs-on: ${{ vars.DIVE_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Never cache or prune CARGO_HOME/bin on self-hosted runners: the post
          # step deletes binaries that predate the job (docs/developer/ci.md).
          cache-bin: ${{ runner.environment == 'github-hosted' }}
      - name: Cache pinned oracle and source
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIVE_CACHE_DIR }}
          key: dive-frontend-${{ runner.os }}-${{ hashFiles('conformance/oracles.toml', 'conformance/corpora.toml') }}
          restore-keys: dive-frontend-${{ runner.os }}-
      - name: Build harness and frontend
        run: cargo build --release --locked -p dive-conformance -p dive-cli
      - name: Fetch pinned oracle and source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target/release/dive-conformance oracle fetch
          target/release/dive-conformance corpus fetch --corpus examples
      - name: Frontend mutation and SANY-case campaign
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pin=$(python3 -I -c 'import runpy; from pathlib import Path; m=runpy.run_path("scripts/frontend-campaign.py"); print(m["source_pin"](Path.cwd()))')
          python3 -I scripts/frontend-campaign.py \
            --source-root "$DIVE_CACHE_DIR/git/examples/$pin" \
            --out "$RUNNER_TEMP/frontend-campaign" \
            --seed 20261009 --sources 64 --per-file 4 --jobs 2 --timeout 15
      - name: Upload complete frontend evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-deep-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-campaign
          if-no-files-found: error
          retention-days: 30
  baseline:
    name: Small-tier regression check (baselines)
    if: ${{ github.event_name == 'schedule' || (inputs.scope != 'frontend' && inputs.tier == 'small') }}
    runs-on: ${{ vars.DIVE_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Never cache or prune CARGO_HOME/bin on self-hosted runners: the post
          # step deletes binaries that predate the job (docs/developer/ci.md).
          cache-bin: ${{ runner.environment == 'github-hosted' }}
      - name: Cache oracles, JRE and corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIVE_CACHE_DIR }}
          key: dive-cache-${{ runner.os }}-${{ hashFiles('conformance/oracles.toml', 'conformance/corpora.toml') }}
          restore-keys: dive-cache-${{ runner.os }}-
      - name: Build harness and dive
        run: cargo build --release --locked -p dive-conformance -p dive-cli
      - name: Fetch and verify oracles and the examples corpus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target/release/dive-conformance oracle fetch
          target/release/dive-conformance corpus fetch --corpus examples
      # The same selection, timeout and baselines as `cargo xtask gate --full`.
      # A model
      # or module that agreed in the baseline and no longer does, or a changed
      # observable, fails the step; improvements are listed and pass.
      - name: dive (tlc profile) against its baseline
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/baseline"
          target/release/dive-conformance run \
            --impl dive --impl-profile tlc \
            --corpus examples --corpus probes --corpus validation-smoke --corpus configured-temporal-operators \
            --tier small --workers 1 --jobs 2 --timeout 1800 \
            --baseline conformance/baselines/small-tlc-w1.json \
            --report-dir "$RUNNER_TEMP/baseline" --no-summary
      - name: dive (default profile) against its baseline
        if: always()
        run: |
          target/release/dive-conformance run \
            --impl dive --impl-profile dive \
            --corpus examples --corpus probes --corpus validation-smoke --corpus configured-temporal-operators \
            --tier small --workers 1 --no-sany --jobs 2 --timeout 1800 \
            --baseline conformance/baselines/small-dive-w1.json \
            --report-dir "$RUNNER_TEMP/baseline" --no-summary
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/baseline
          if-no-files-found: warn
          retention-days: 30
  conformance:
    name: Conformance (${{ inputs.tier || 'small' }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'frontend' }}
    runs-on: ${{ vars.DIVE_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: ${{ (inputs.tier || 'small') == 'deep' && 355 || 160 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Never cache or prune CARGO_HOME/bin on self-hosted runners: the post
          # step deletes binaries that predate the job (docs/developer/ci.md).
          cache-bin: ${{ runner.environment == 'github-hosted' }}
      - name: Cache oracles, JRE and corpora
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIVE_CACHE_DIR }}
          # Content-addressed and verified on every use, so a stale cache can
          # only cost a re-download, never a wrong artifact.
          key: dive-cache-${{ runner.os }}-${{ hashFiles('conformance/oracles.toml', 'conformance/corpora.toml') }}
          restore-keys: dive-cache-${{ runner.os }}-
      - name: Build harness and dive
        run: cargo build --release --locked -p dive-conformance -p dive-cli
      - name: Fetch and verify oracles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: target/release/dive-conformance oracle fetch
      - name: Fetch corpora
        run: |
          target/release/dive-conformance corpus fetch \
            --corpus examples --corpus tlaplus-tests --corpus community-modules
      - name: Run TLC against committed goldens
        run: |
          mkdir -p "$RUNNER_TEMP/conformance"
          target/release/dive-conformance run \
            --impl tlc \
            --corpus examples --corpus probes --corpus validation-smoke \
            --tier "$TIER" \
            --workers 1,4 \
            --jobs 2 \
            --xmx 5g \
            --crosscheck-manifest \
            --report-dir "$RUNNER_TEMP/conformance" \
            --summary "$RUNNER_TEMP/conformance/conformance.md"
      # dive against the committed goldens, under --compat=tlc: its front end
      # against the SANY goldens of every module corpus (dive analyze), and
      # the tier's models with `dive check` (M5 WP-D2). `unsupported` and
      # `agree-pending-trace-validation` are not findings, so only a
      # `disagree`, `oracle-error` or `timeout` fails the step (exit 1).
      - name: Run dive (modules, full SANY; models) against committed goldens
        if: always()
        timeout-minutes: ${{ (inputs.tier || 'small') == 'deep' && 240 || 60 }}
        run: |
          target/release/dive-conformance run \
            --impl dive \
            --impl-profile tlc \
            --corpus examples --corpus probes --corpus validation-smoke --corpus tlaplus-tests --corpus community-modules \
            --tier "$TIER" \
            --jobs 2 \
            --timeout 600 \
            --report-dir "$RUNNER_TEMP/conformance" \
            --summary "$RUNNER_TEMP/conformance/conformance-dive.md"
      # dive's default profile (ADR 0010) on the tier's models only: modules
      # do not depend on the profile, and the step above already covers them.
      # Owner-approved divergences (conformance/expected-divergences.toml,
      # e.g. D-010's counts at a violation) are `expected-divergence`, so
      # only an unregistered difference fails the step.
      - name: Run dive (models, default profile) against committed goldens
        if: always()
        timeout-minutes: ${{ (inputs.tier || 'small') == 'deep' && 240 || 30 }}
        run: |
          target/release/dive-conformance run \
            --impl dive \
            --impl-profile dive \
            --corpus examples --corpus probes --corpus validation-smoke \
            --tier "$TIER" \
            --no-sany \
            --jobs 2 \
            --timeout 600 \
            --report-dir "$RUNNER_TEMP/conformance" \
            --summary "$RUNNER_TEMP/conformance/conformance-dive-default.md"
      - name: Run dive (modules, SANY parse phase) against committed goldens
        if: always()
        timeout-minutes: 20
        run: |
          target/release/dive-conformance run \
            --impl dive \
            --sany-phase parse \
            --sany-only \
            --corpus examples --corpus validation-smoke --corpus tlaplus-tests --corpus community-modules \
            --tier "$TIER" \
            --jobs 2 \
            --timeout 120 \
            --report-dir "$RUNNER_TEMP/conformance" \
            --summary "$RUNNER_TEMP/conformance/conformance-dive-parse.md"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-${{ env.TIER }}-${{ github.run_id }}
          path: ${{ runner.temp }}/conformance
          if-no-files-found: warn
          retention-days: 30

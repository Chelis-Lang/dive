[package]
name = "dive-model"
description = "Binding a specification to its TLC model configuration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dive-ir.workspace = true
sha2.workspace = true
dive-value.workspace = true
dive-config.workspace = true
# `enumerate` comes from this crate's own feature below.
dive-eval = { path = "../dive-eval", default-features = false }

[features]
# The next-state relation split into the successor generator's actions
# (`Model::actions`), which needs `dive-eval`'s enumerator.
default = ["enumerate"]
enumerate = ["dive-eval/enumerate"]

[dev-dependencies]
dive-sema.workspace = true
serde_json.workspace = true

[lints]
workspace = true

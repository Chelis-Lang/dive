[package]
name = "dive-api"
description = "Embeddable Rust API of the dive TLA+ tools: parsing, semantic analysis, model checking, simulation and trace validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-api"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
dive-pluscal = { workspace = true }
dive-config = { workspace = true }
dive-sema = { workspace = true }
dive-syntax = { workspace = true }
dive-ir = { workspace = true }
dive-value = { workspace = true }
dive-eval = { workspace = true }
dive-stdlib = { workspace = true }
dive-store = { workspace = true }
# The shared run contract Core uses (ADR 0155).
dive-runtime = { workspace = true }
dive-core = { workspace = true }
dive-explore = { workspace = true }
dive-sim = { workspace = true }
dive-liveness = { workspace = true }
dive-model = { workspace = true }
dive-trace = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

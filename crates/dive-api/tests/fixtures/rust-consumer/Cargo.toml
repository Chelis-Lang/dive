[package]
name = "dive-public-api-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

# Deliberately independent of the repository workspace's feature union.
[workspace]
resolver = "3"

[workspace.dependencies]
dive-api = { path = "../../.." }
serde_json = "1"

[dependencies]
dive-api = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "workflows"
path = "tests/workflows.rs"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[package]
name = "dive-trace"
description = "Trace format and independent trace validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dive-ir.workspace = true
dive-value.workspace = true
# The successor enumerator stays off in both: the validator must never be able
# to call it (ADR 0016 §2). `cargo xtask check-layering` and the standalone
# `cargo build -p dive-trace` in the gate enforce this.
dive-eval = { path = "../dive-eval", default-features = false }
dive-model = { path = "../dive-model", default-features = false }
serde_json.workspace = true

[dev-dependencies]
dive-sema.workspace = true
dive-config.workspace = true

[lints]
workspace = true

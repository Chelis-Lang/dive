[package]
name = "dive-trace"
description = "TLA+ counterexample trace format and independent trace validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-trace"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
dive-ir.workspace = true
dive-value.workspace = true
# The core evaluator decides ENABLED and existential quantification with its
# own search (ADR 0103).
dive-eval.workspace = true
dive-model.workspace = true
serde_json.workspace = true
# Digests of streamed documents (`stream::Measure`); already a dependency of
# dive-model.
sha2.workspace = true

[dev-dependencies]
dive-sema = { path = "../dive-sema" }
dive-config = { path = "../dive-config" }

[lints]
workspace = true

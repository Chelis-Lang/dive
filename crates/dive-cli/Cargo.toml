[package]
name = "dive-cli"
description = "The dive TLA+ model checker command-line tool, with a TLC-compatible `tlc` command"
default-run = "dive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-cli"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/build.rs", "/build/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[[bin]]
name = "dive"
path = "src/main.rs"

[[bin]]
name = "tlc"
path = "src/bin/tlc.rs"

[dependencies]
dive-api = { workspace = true }
mimalloc = { workspace = true }
serde_json = { workspace = true }

# The locked v3.3.2 loses arena-backed allocations on growing Linux heaps.
[target.'cfg(target_os = "linux")'.dependencies]
mimalloc = { workspace = true, features = ["v2"] }

[lints]
workspace = true

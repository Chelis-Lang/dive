[package]
name = "dive-check"
description = "Explicit-state safety model checking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dive-ir.workspace = true
dive-value.workspace = true
# The successor enumerator (`dive_eval::next`) is the checker's engine.
dive-eval.workspace = true
dive-config.workspace = true
dive-store.workspace = true
dive-stdlib.workspace = true
dive-model.workspace = true
# The shared run contract (ADR 0155).
dive-runtime.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Checkpoint tests rewrite archive checksums.
sha2.workspace = true
# The probe tests load their specifications; dev-dependencies are outside the
# layering (`xtask/src/layering.rs`).
dive-sema.workspace = true
# Unit tests synchronize the parallel budget race through a test hook.
dive-runtime = { workspace = true, features = ["test-hooks"] }

[lints]
workspace = true

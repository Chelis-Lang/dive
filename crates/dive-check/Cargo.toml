[package]
name = "dive-check"
description = "Explicit-state safety model checking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dive-ir.workspace = true
dive-value.workspace = true
# The successor enumerator (`dive_eval::next`) is the checker's engine.
dive-eval = { workspace = true, features = ["enumerate"] }
dive-config.workspace = true
dive-store.workspace = true
dive-stdlib.workspace = true
dive-model.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
# The probe tests load their specifications; dev-dependencies are outside the
# layering (`xtask/src/layering.rs`).
dive-sema.workspace = true

[lints]
workspace = true

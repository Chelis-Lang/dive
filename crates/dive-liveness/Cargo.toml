[package]
name = "dive-liveness"
description = "Liveness and temporal property checking for TLA+ specifications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-liveness"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
dive-ir.workspace = true
dive-eval.workspace = true
dive-value.workspace = true
dive-model.workspace = true
# The run host of the source-binding dispatch.
dive-stdlib.workspace = true
# The shared run contract (ADR 0155).
dive-runtime.workspace = true
dive-config.workspace = true

[dev-dependencies]
dive-sema = { path = "../dive-sema" }
serde_json.workspace = true
dive-trace = { path = "../dive-trace" }

[lints]
workspace = true

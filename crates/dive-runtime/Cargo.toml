[package]
name = "dive-runtime"
description = "The run contract shared by dive's checking engines: options, budgets, results and capture evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-runtime"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
dive-ir.workspace = true
dive-value.workspace = true
dive-eval.workspace = true
dive-config.workspace = true
dive-store.workspace = true
dive-stdlib.workspace = true
dive-model.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
memory-stats.workspace = true

[dev-dependencies]
# Doctests and unit tests lower small specifications; dev-dependencies are
# outside the layering (`xtask/src/layering.rs`).
dive-sema = { path = "../dive-sema" }

[lints]
workspace = true

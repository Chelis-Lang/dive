[package]
name = "dive-core"
description = "The dive execution core for TLA+: value store, plan compiler, interpreter and successor generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-core"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
dive-ir.workspace = true
# Only at the binder boundary: startup constants computed by the reference
# binder are converted to handles (ADR 0117 item 6).
dive-value.workspace = true
# Integers outside the inline 61-bit range (D-004; `int.rs`).
num-bigint.workspace = true
num-integer.workspace = true
num-traits.workspace = true

[lints]
workspace = true

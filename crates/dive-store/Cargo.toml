[package]
name = "dive-store"
description = "State fingerprints and disk-backed state storage for TLA+ model checking"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/dive-store"
readme = "README.md"
keywords.workspace = true
categories.workspace = true
# Tests, examples and benchmarks read workspace fixtures; they are not shipped.
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[dependencies]
dive-value.workspace = true

[dev-dependencies]
# The end-to-end check of TLC's state fingerprints lowers its specifications
# (tests/tlc_state_fingerprints.rs); dev-dependencies are outside the layering.
dive-sema = { path = "../dive-sema" }
dive-ir = { path = "../dive-ir" }
proptest.workspace = true
divan.workspace = true
serde_json.workspace = true

[[bench]]
name = "store"
harness = false

[lints]
workspace = true

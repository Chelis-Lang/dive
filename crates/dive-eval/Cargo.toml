[package]
name = "dive-eval"
description = "Expression and action evaluator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The successor enumerator (`dive_eval::next`, ADR 0014 §3). `dive-trace`
# keeps it off so the independent trace validator cannot call it (ADR 0016 §2);
# `cargo xtask check-layering` enforces that. `dive-model` and `dive-trace`
# must therefore depend on `dive-eval` with `default-features = false`.
# Without it, `ENABLED` (which searches for a successor) is refused.
default = ["enumerate"]
enumerate = []

[dependencies]
dive-ir.workspace = true
dive-value.workspace = true

[dev-dependencies]
dive-sema.workspace = true
dive-config.workspace = true
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# The successor generator's tests and corpus runner need it.
[[test]]
name = "next_probes"
required-features = ["enumerate"]

[[test]]
name = "next_examples"
required-features = ["enumerate"]

[[example]]
name = "next_corpus"
required-features = ["enumerate"]

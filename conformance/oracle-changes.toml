[[change]]
id = "alias-keyword"
upstream_commit = "f5306c601"
description = "The ALIAS cfg keyword (2020-07-08). v1.7.4 rejects it, either as a nested config error inside GENERAL or by reading ALIAS as a property name"
link = "docs/internal/survey/oracle-history.md"
absent_in = ["tlc-1.7.4"]
present_in = ["tlc-2026.10.06.014338"]
# The small-tier models whose cfg uses ALIAS and that v1.7.4 fails on.
models = [
  "specifications/braf/BufferedRandomAccessFile.cfg",
  "specifications/ewd426/TokenRing.cfg",
  "specifications/tower_of_hanoi/Hanoi_anim.cfg",
]
fields = ["verdict", "error_class", "violated_property", "counts.*", "trace.*"]
absent_result = { error_class = ["GENERAL", "TLC_CONFIG_SPECIFIED_NOT_DEFINED"] }

[[change]]
id = "depth-zero-states"
upstream_commit = "508aaf05f"
description = "TLC reported a search depth of 1 when no state was generated (constant-only models); it now reports 0 (2021-07-29)"
link = "docs/internal/survey/oracle-history.md"
absent_in = ["tlc-1.7.4"]
present_in = ["tlc-2026.10.06.014338"]
models = ["specifications/**"]
fields = ["counts.depth"]
present_result = { distinct_states = 0 }

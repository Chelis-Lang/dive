# intermediate states as generated; the default profile counts only composed
# successors. Verdict, distinct states, queue and depth still agree.

[[divergence]]
id = "d022-finitemonotonic-mcreplicatedlog"
pattern = "specifications/FiniteMonotonic/MCReplicatedLog.cfg"
profile = "dive"
expected_verdict = "success"
fields = ["counts.states_generated"]
justification = "Action composition with its TLA+ meaning (D-022) generates 11617 states without TLC's composition intermediates (TLC: 17425); Convergence holds and the 1363 distinct states and depth 13 agree"

# Owner-approved divergences of dive's default profile from TLC (ADR 0010).
#
# dive runs under one of three profiles, recorded in every report:
#   dive            the default; may differ from TLC where listed here
#   tlc             pure TLC behaviour (--compat=tlc or DIVE_COMPAT=tlc);
#                   must match TLC everywhere. Only this profile counts for
#                   the strict tier.
#   tlc+overrides   TLC behaviour with listed per-feature overrides; never
#                   strict-tier agreement
#
# Under `dive`, a disagreement matching an entry below, with the entry's
# expected verdict and with every differing field among the entry's
# `fields` or its exact `exit_code_pair`/`generated_count_pair`, is reported as
# `expected-divergence`. It is never counted
# as `agree`. Everything else is `disagree`. The registry never applies under
# `tlc` or `tlc+overrides`, and an entry naming them is a configuration error.
#
# Entry shape (exact exit/count pairs are optional; give exactly one profile/option). `fields`
# are globs over the compared fields (`verdict`, `error_class`,
# `violated_property`, `counts.*`, `trace.length`, `trace.ending`); list only
# those that actually differ. Numeric exits require exit_code_pair with integer
# expected/actual codes in 0..255; field globs cannot excuse exits. The declared
# pair must occur alongside only permitted other differences. An optional
# unreduced_symmetry_counts additionally binds all distinct/generated/depth facts
# and the actual native whole-run unreduced mode, only under default dive.
# generated_count_pair requires exact unsigned expected/actual generated counts;
# when present, no field glob may cover counts.states_generated. Trace validation
# can never be excused.
#
# [[divergence]]
# id = "big-integers"                         # stable, unique
# pattern = "specifications/**/MC*.cfg"       # model or module path glob
# profile = "dive"                            # or: option = "int=big"
# expected_verdict = "success"                # dive's verdict where TLC differs
# fields = ["verdict", "error_class"]         # the fields that may differ
# justification = "dive uses arbitrary-precision integers by default"
# link = "docs/divergences.md#integer-overflow"
#
# Approved today but without corpus entries yet: big integers (TLC raises
# TLC_MODULE_OVERFLOW at 32 bits), and refusing symmetry with liveness
# (TLC only warns). Entries are added once dive implements them, with the
# affected models identified.

# D-010: canonical exploration order (owner-approved default, 2026-10-08).
# Exploring sets in canonical rather than TLC's interning order reaches the
# same violation at the same depth, with the same property and counterexample
# length, but stops after a different number of states. Only the counts at the
# stop differ; under --compat=tlc both models agree (CM1 gate).
# ADR 0097 actual CLI controls return 12 in the ordinary default for both rows;
# only their count differences remain. Historical 12/10 measurements are retained.

[[divergence]]
id = "d010-missionaries-and-cannibals"
pattern = "specifications/MissionariesAndCannibals/MissionariesAndCannibals.cfg"
profile = "dive"
expected_verdict = "safety-violation"
fields = ["counts.states_generated"]
justification = "Canonical exploration order (D-010) generates one more state (226 vs TLC's 225) before reaching the same Solution violation at the same depth"
link = "docs/divergences.md#registry"

[[divergence]]
id = "d010-acp-nb-wrong-tlc"
pattern = "specifications/acp/ACP_NB_WRONG_TLC.cfg"
profile = "dive"
expected_verdict = "safety-violation"
fields = [
  "counts.distinct_states",
  "counts.states_generated",
  "counts.states_left_on_queue",
]
justification = "Canonical exploration order (D-010) reaches the same AC1 violation at the same depth after 12645 distinct / 64357 generated / 970 queued states (TLC: 11852 / 59286 / 1248)"
link = "docs/divergences.md#registry"

# Probes (conformance/corpus/probes; docs/survey/competitive.md) whose default
# profile answer differs from TLC's by owner-approved design.

[[divergence]]
id = "d004-p1-overflow"
pattern = "specifications/P1Overflow/P1Overflow.cfg"
profile = "dive"
exit_code_pair = { expected = 255, actual = 0 }
expected_verdict = "success"
fields = ["verdict", "error_class", "counts.*"]
justification = "Unbounded integers (D-004): x reaches 2147483648, where TLC's 32-bit integers raise TLC_INTEGER_TOO_BIG; in TLA+ the invariant holds and the search ends after 3 states, as dive reports"
link = "docs/divergences.md#registry"

# D-004: normally generated primary reference and unchanged-main measurement.
# TLC's Init wrapper is GENERAL/75; default computes 2^32, then one self-loop.
[[divergence]]
id = "d004-nested-powerset-cardinality"
pattern = "specifications/ExplicitOuterPowersetCardinality/ExplicitOuterPowersetCardinality.cfg"
profile = "dive"
exit_code_pair = { expected = 75, actual = 0 }
generated_count_pair = { expected = 0, actual = 2 }
expected_verdict = "success"
fields = ["verdict", "error_class", "counts.distinct_states", "counts.depth"]
justification = "Unbounded integers (D-004): explicit outer Cardinality computes 4294967296 without TLC's 32-bit size overflow; the unchanged model has 1 distinct / 2 generated states and depth 1"
link = "docs/divergences.md#registry"

[[divergence]]
id = "d006-p2-choose-str"
pattern = "specifications/P2Choose/P2Choose_str.cfg"
profile = "dive"
exit_code_pair = { expected = 12, actual = 0 }
expected_verdict = "success"
fields = ["verdict", "error_class", "violated_property", "counts.*", "trace.length", "trace.ending"]
justification = "Canonical CHOOSE order (D-006): CHOOSE e \\in {\"zeta\", \"alpha\", \"mid\"} : TRUE is \"alpha\" in the canonical order and \"zeta\" in TLC's interning order. TLA+ fixes neither, so SLex holds under dive's default and is violated under TLC's"
link = "docs/divergences.md#registry"

# D-009: reflexive membership succeeds before an unrelated raw prefix refusal.
# Exact existing model/default profile only; no new comparison policy.
[[divergence]]
id = "d009-modelbadprefix-reflexive-membership"
pattern = "specifications/ModelBadPrefix/ModelBadPrefix.cfg"
profile = "dive"
exit_code_pair = { expected = 75, actual = 0 }
generated_count_pair = { expected = 1, actual = 2 }
expected_verdict = "success"
fields = ["verdict", "error_class", "counts.distinct_states", "counts.depth"]
justification = "D-009: reflexive a \\in {1,a} succeeds in the default profile despite TLC's earlier typed-model comparison refusal; pinned TLC fingerprint exception2147 stops at 1 distinct/1 generated/depth1, while default completes at 2/2/depth2. No trace or TLC-profile differences are authorized."
link = "docs/divergences.md#registry"


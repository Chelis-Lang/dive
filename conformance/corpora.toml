# Pinned conformance corpora. Moving a pin requires regenerating affected
# goldens with a recorded reason.

[[corpus]]
id = "examples"
repo = "https://github.com/tlaplus/Examples"
commit = "6a7b26a31c1a6aeec789b455e9bbfa3b3ad2728f" # 2026-10-03
license = "MIT"
# Per-spec manifest.json files enumerate modules and models (ADR 0005).
layout = "examples-manifest"

[[corpus]]
id = "community-modules"
repo = "https://github.com/tlaplus/CommunityModules"
commit = "78b98ae9939d2fe7a6615e9a4b21dd6c23ef8ff3" # 2026-10-04, release 202610040242
license = "MIT"
layout = "modules-only"

[[corpus]]
id = "validation-test-suite"
repo = "https://github.com/tlaplus/ValidationTestSuite"
commit = "fe99cff1ca48535bdbfc99fd95bd2706f056c12f" # 2026-09-10
license = "Apache-2.0"
layout = "tbd"

# Bounded generated subset of the source-only ValidationTestSuite above.
# selection.json accounts for every selected case, including reference variants
# and upstream skips. Runtime/truth are unknown until measured by our oracle;
# these models are in the deep tier. See docs/conformance-corpora.md.
[[corpus]]
id = "validation-smoke"
path = "conformance/corpus/validation-smoke"
license = "Apache-2.0"
layout = "examples-manifest"

[[corpus]]
id = "tlaplus-tests"
repo = "https://github.com/tlaplus/tlaplus"
commit = "94d0c5070852b37b801bb8998c436383ab7ee37b" # same commit as the default TLC oracle
license = "MIT"
# Modules only: every `.tla` file of TLC's and SANY's own test trees (808
# files, including SANY's semantic `error_corpus`), for SANY goldens. The
# models there are driven by JUnit tests, not by manifests, so none is
# enumerated.
layout = "modules-only"
include = [
  "tlatools/org.lamport.tlatools/test/**",
  "tlatools/org.lamport.tlatools/test-model/**",
]

# Modules that crash the pinned SANY: no oracle fact, so no golden. They are
# reported as `out-of-scope`, never dropped.
[[corpus.exclude]]
path = "tlatools/org.lamport.tlatools/test/tla2sany/semantic/error_corpus/E4294_Module_Test.tla"
reason = "crashes SANY (tlc-2026.10.06.014338): semantic analysis throws util.WrongInvocationException \"Defined more recursive operators than were declared in RECURSIVE statements.\" (Generator.endOpDefNode), wrapped in FrontEndException, exit 255, no error marker. Upstream expects error 4294 (a nested module between RECURSIVE and the definition). dive rejects it with DIVE-E0124 (SANY 4294)"

# dive's own corpus, kept in this repository (ADR 0005, amendment 1): the
# honesty and determinism probes of docs/survey/competitive.md (P1-P9, M1-M2),
# in the Examples layout with Examples-format manifests. Identified by the
# SHA-256 of its files instead of a commit; editing any file means
# regenerating its goldens.
[[corpus]]
id = "probes"
path = "conformance/corpus/probes"
license = "MIT"
layout = "examples-manifest"

# Direct configured user operators in retained temporal state/action atoms.
# Kept separate so the established probes corpus retains its input identity.
[[corpus]]
id = "configured-temporal-operators"
path = "conformance/corpus/configured-temporal-operators"
license = "MIT"
layout = "examples-manifest"

[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
# Opt-in: only the crates that set `publish = ["crates-io"]` are published
# (docs/developer/releasing.md).
publish = false
repository = "https://github.com/Chelis-Lang/dive"
homepage = "https://github.com/Chelis-Lang/dive"
documentation = "https://docs.rs/dive-api"
license = "MIT"
keywords = ["tla", "tlaplus", "model-checker", "formal-verification", "pluscal"]
categories = ["development-tools", "science"]

[workspace.dependencies]
# Internal crates. Allowed edges are enforced by `cargo xtask check-layering`.
# Published crates move in lockstep: every requirement is the exact workspace
# version, bumped together with `[workspace.package] version`. Internal
# dev-dependencies are written as plain paths in each crate so packaging drops
# them (dev-dependency cycles cannot be published).
dive-syntax = { path = "crates/dive-syntax", version = "=0.1.0" }
dive-sema = { path = "crates/dive-sema", version = "=0.1.0" }
dive-ir = { path = "crates/dive-ir", version = "=0.1.0" }
dive-value = { path = "crates/dive-value", version = "=0.1.0" }
dive-eval = { path = "crates/dive-eval", version = "=0.1.0" }
dive-stdlib = { path = "crates/dive-stdlib", version = "=0.1.0" }
dive-config = { path = "crates/dive-config", version = "=0.1.0" }
dive-store = { path = "crates/dive-store", version = "=0.1.0" }
dive-runtime = { path = "crates/dive-runtime", version = "=0.1.0" }
dive-liveness = { path = "crates/dive-liveness", version = "=0.1.0" }
dive-sim = { path = "crates/dive-sim", version = "=0.1.0" }
dive-trace = { path = "crates/dive-trace", version = "=0.1.0" }
dive-model = { path = "crates/dive-model", version = "=0.1.0" }
dive-pluscal = { path = "crates/dive-pluscal", version = "=0.1.0" }
dive-api = { path = "crates/dive-api", version = "=0.1.0" }
dive-conformance = { path = "crates/dive-conformance" }
dive-core = { path = "crates/dive-core", version = "=0.1.0" }
dive-explore = { path = "crates/dive-explore", version = "=0.1.0" }

# Third-party. Add here first, then reference with `workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rowan = "0.16"
lz4_flex = { version = "0.14.2", default-features = false, features = ["safe-encode", "safe-decode", "checked-decode"] }
proptest = { version = "1", default-features = false, features = ["std"] }
rayon-core = "1.13"
sha2 = "0.11"
hmac = "0.13"
getrandom = "0.4"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
# Nonreaping Unix child ownership in the conformance harness (ADR 0112).
rustix = { version = "=1.1.6", features = ["process"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
divan = "0.1"
# Global allocator for the dive binaries only (ADR 0102).
mimalloc = { version = "0.1", default-features = false }
# Safe native process RSS on macOS (ADR 0109).
memory-stats = { version = "1.2.0", default-features = false }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = [] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
dbg_macro = "deny"

# Small debug info keeps build directories small.
# For a debugger session: CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
debug = "line-tables-only"
# Whole-program optimisation (ADR 0102). Keep `panic = "unwind"`: the worker
# pool and engine recover worker panics with `catch_unwind`.
lto = "fat"
codegen-units = 1

# Profiling builds: `cargo build --profile profiling`.
[profile.profiling]
inherits = "release"
debug = true

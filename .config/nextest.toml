[profile.default]
fail-fast = false

# CI's `Workspace gate` (`cargo xtask gate --fast`). It leaves out the slow,
# evidence-oriented and multi-worker matrix tests, which `cargo xtask gate
# --full` (default profile) still runs. Selected from per-test durations of
# main CI run 38214486988 (1768 tests, 8385 test-seconds) and PR #243's runs:
# the selection keeps about 1230 tests and 400 test-seconds (about three
# minutes on the 2-vCPU hosted runner), and tests of every crate.
# To run the excluded tests on their own:
#   cargo nextest run --workspace --profile ci --ignore-default-filter
[profile.ci]
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 3 }
default-filter = """
not (
    binary_id(dive-api::native_checkpoint_spill)
    | (binary_id(dive-api::core_candidates) & test(=candidate_spill_preserves_profiles_stores_widths_history_and_independent_words))
    | binary_id(dive-api::core_golden)
    | binary_id(dive-api::native_checkpoint_runtime_names)
    | binary_id(dive-api::native_checkpoint_keys)
    | binary_id(dive-api::view_normalization)
    | binary_id(dive-api::storage_tuple_function)
    | binary_id(dive-api::process_procedure_checksum)
    | binary_id(dive-api::recursive_procedure_checksum)
    | binary_id(dive-api::acyclic_procedure_checksum)
    | binary_id(dive-api::nested_procedure_checksum)
    | binary_id(dive-api::multiline)
    | binary_id(dive-api::material_capture)
    | (binary_id(dive-api::configured_random) & (
        test(=property_bearing_final_routes_do_not_return_configured_rng_false_verdicts)
        | test(=configured_random_corrects_both_wrong_verdicts_and_matches_direct_api_reports)
    ))
    | (binary_id(dive-api::native_checkpoint) & test(/^frontier_recovery_/))
    | (binary_id(dive-api::predecessor_spill) & test(=zero_tiny_logs_equal_memory_at_all_worker_widths_and_chaos))
    | (binary_id(dive-store::state_fingerprint) & test(=fingerprint_and_exact_membership_agree_on_a_large_sample))
    | (binary_id(dive-cli::ordinary_final) & test(=default_schedule_stops_at_the_first_due_level))
    | (binary_id(dive-cli::distributed) & test(=four_process_workers_match_local_results_deterministically_across_verdicts))
)
"""
